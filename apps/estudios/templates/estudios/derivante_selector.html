<section class="derivante-selector" data-derivante-selector data-selector-url="{% url 'selector_odontologos' %}">
    <div class="derivante-heading"><div><p class="eyebrow">PROFESIONAL SOLICITANTE</p><h2>Elegí el odontólogo derivante</h2><p>Este profesional quedará autorizado para consultar el estudio.</p></div><a class="button button-secondary button-small" href="{% url 'odontologo_crear' %}?next={{ request.get_full_path|urlencode }}">Registrar nuevo</a></div>
    <input type="hidden" name="derivante" value="{{ form.derivante.value|default_if_none:'' }}" data-selector-value>
    <p data-selector-selection aria-live="polite"></p>
    <button class="button button-secondary button-small" type="button" data-selector-clear>Asignar más tarde</button>
    <div class="search-field"><label>Buscar derivante<input type="search" data-selector-search autocomplete="off" placeholder="Nombre, apellido, matrícula o correo"></label></div>
    <div class="derivante-results" data-selector-results></div>
    <p data-selector-status role="status"></p>
    <button type="button" class="button button-secondary button-small" data-selector-prev>Anterior</button>
    <button type="button" class="button button-secondary button-small" data-selector-next>Siguiente</button>
    {% for error in form.derivante.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
</section>
