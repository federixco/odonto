{% extends "base.html" %}

{% block title %}Editar {{ odontologo }} - SISETMA{% endblock %}

{% block content %}
<h2>Editar: {{ odontologo.apellido }}, {{ odontologo.nombre }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar Cambios</button>
    <a href="{% url 'odontologo_detalle' odontologo.pk %}">Cancelar</a>
</form>
{% endblock %}
