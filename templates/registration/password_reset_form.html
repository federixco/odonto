{% extends "base.html" %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<h2>Recuperar Contraseña</h2>
<p>Ingresa tu correo electrónico para enviarte un enlace de recuperación.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enviar Enlace</button>
</form>
{% endblock %}
