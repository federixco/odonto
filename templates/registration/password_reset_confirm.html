{% extends "base.html" %}

{% block title %}Crear Nueva Contraseña{% endblock %}

{% block content %}
<h2>Nueva Contraseña</h2>
{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Cambiar Contraseña</button>
    </form>
{% else %}
    <p>El enlace de recuperación no es válido o ha expirado. Por favor, solicita uno nuevo.</p>
{% endif %}
{% endblock %}
